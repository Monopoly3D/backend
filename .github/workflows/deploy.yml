name: Build and Deploy Monopoly3D Backend Server

on:
  push:
    branches:
      - main
      - feature_cicd  # ONLY FOR TESTING

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: prepare

    permissions:
      contents: read
      packages: write

    services:
      docker:
        image: docker:28.0.1
        options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        run: echo ${{ secrets.DEPLOY_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push docker image to GitHub Container Registry
        run: |
          docker build -t ghcr.io/monopoly3d/main .
          docker push ghcr.io/monopoly3d/main:latest

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Setup SSH
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} > ~/.ssh/known_hosts

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker BuildX
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry and Deploy to Server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cd ${{ secrets.WORK_DIR }} && echo ${{ secrets.DEPLOY_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin && docker pull ghcr.io/monopoly3d/main:latest && docker compose up -f docker-compose.yaml -d && exit"

      - name: Cleanup SSH
        run: rm -rf ~/.ssh
