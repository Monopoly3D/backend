services:
  postgres:
    container_name: monopoly_postgres
    image: postgres:latest
    restart: on-failure
    env_file: ".postgres.env"
    ports:
      - "5432:5432"
    volumes:
      - "postgres-data:/data"

  redis:
    container_name: monopoly_redis
    image: redis:latest
    restart: on-failure
    command: "redis-server /usr/local/etc/redis/redis.conf"
    ports:
      - "6379:6379"
    volumes:
      - "redis-data:/data"
      - "./redis.conf:/usr/local/etc/redis/redis.conf"

  minio:
    container_name: monopoly_minio
    image: minio/minio:latest
    restart: on-failure
    command: server /data --console-address ":9001"
    env_file: ".minio.env"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "minio-data:/data"

  server:
    container_name: monopoly_server
    build: .
    restart: on-failure
    command: bash -c "poetry run alembic upgrade head && poetry run uvicorn --host 0.0.0.0 --port 8000 --loop asyncio --log-config app/api/v1/logging.json app.asgi:app"
    env_file: ".server.env"
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

volumes:
  postgres-data:
  redis-data:
  minio-data:
